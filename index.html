  if(!x)return;gsClose();
  if(x.k==='lead'){go('crm:leads');CRM.openLead(x.id);}
  else if(x.k==='prop'||x.k==='contr'){go('crm:propuestas');CRM.openGen(x.k,x.id);}
  else if(x.k==='emp'||x.k==='trab'){go('op:empresas:'+x.id);}
  else if(x.k==='fact'){go('fact');OP.openFact(x.id);}
  else if(x.k==='proc'){go('set:procesos');OP.openProc(x.id);}
}
$('#gs-btn').addEventListener('click',gsOpen);
gsQ.addEventListener('input',gsRun);
gs.addEventListener('click',e=>{if(e.target===gs||e.target.closest('[data-gs="close"]'))return gsClose();const b=e.target.closest('.gs-i');if(b)gsGo(gsItems[+b.dataset.gi]);});
gs.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();gsClose();}
  else if(e.key==='ArrowDown'){e.preventDefault();if(gsItems.length){gsSel=(gsSel+1)%gsItems.length;gsPaint();}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(gsItems.length){gsSel=(gsSel-1+gsItems.length)%gsItems.length;gsPaint();}}
  else if(e.key==='Enter'&&e.target===gsQ){e.preventDefault();gsGo(gsItems[gsSel]);}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();gs.hidden?gsOpen():gsClose();}
  else if(e.key==='/'&&gs.hidden&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')&&!document.activeElement.isContentEditable){e.preventDefault();gsOpen();}
});

/* ---------- Inicio ---------- */
/* cada franja = cabecera a la izquierda + hasta 3 columnas de contenido */
function tile(cls,title,sub,nav,btn,body){
  const cols=Array.isArray(body)?body:[body],wide=cols.length===1?' wide':'';
  return `<section class="card tile ${cls}"><header class="tile-h"><div><h2>${title}</h2><div class="sub">${sub}</div></div><button class="btn sm" data-nav="${nav}">${btn} →</button></header>${cols.map(c=>`<div class="tc${wide}">${c}</div>`).join('')}</section>`;
}
const wait=(msg)=>`<div class="sub">${msg}</div>`;
function crmTile(){
  const d=CRM.homeData();
  const head=['t-crm','Comercial','Ventas y CRM','crm','Abrir CRM'];
  if(d.state==='nodb') return tile(...head,wait('Sin conexión con la base de datos.'));
  if(d.state==='loading') return tile(...head,wait('Conectando con tus datos…'));
  const M=d.M,mesNom=new Intl.DateTimeFormat('es-ES',{month:'long'}).format(new Date());
  const diff=M.hechasSem-M.esperadasSemHoy;
  const ritmo=diff>=0?(diff>=1?`Vas ${Math.floor(diff)} por delante`:'Vas al día'):`Te faltan ${Math.ceil(-diff)} para ir al ritmo`;
  const w=Math.min(100,Math.round(M.hechasSem/M.objetivo*100)),w2=Math.min(100,Math.round(M.esperadasSemHoy/M.objetivo*100));
  const maxC=Math.max(1,...d.activas.map(a=>a.n));
  const fun=d.activas.map(a=>`<div><span>${esc(a.label)}</span><span class="t"><i style="width:${Math.round(a.n/maxC*100)}%"></i></span><b>${a.n}</b></div>`).join('');
  const body=[`<div class="hero"><div class="lab">Llamadas · esta semana</div><div class="v">${M.hechasSem}<small> / ${M.objetivo}</small></div>
      <div class="mbar" role="img" aria-label="${M.hechasSem} de ${M.objetivo} llamadas"><i style="width:${w}%"></i><u style="left:${w2}%" title="Dónde deberías ir hoy"></u></div>
      <div class="s">${ritmo}</div></div>
    <div class="chips2 push">${d.venc?`<button class="btn sm" data-nav="crm:hoy"><b class="${d.vencidos?'bad':''}">${d.venc}</b> seguimiento${d.venc===1?'':'s'} para hoy o vencido${d.venc===1?'':'s'}</button>`:'<span class="chip good">Seguimientos al día</span>'}<span class="chip">${d.leads} leads</span></div>`,
    `<div class="kg">
      <div class="k"><div class="lab">Ganados · ${esc(mesNom)}</div><div class="v">${M.ganadosMes}</div><div class="s">${fmtEUR(M.importeGanadoMes)}</div></div>
      <div class="k"><div class="lab">Tasa de ganadas</div><div class="v">${pctF(M.tasa)}</div><div class="s">${M.ganadas} de ${M.ganadas+M.perdidas} cerradas</div></div>
      <div class="k" style="grid-column:1/-1"><div class="lab">En alta probabilidad</div><div class="v">${fmtEUR(M.altaImporte)}</div><div class="s">${M.altaN} propuesta${M.altaN===1?'':'s'} · abierto en total ${fmtEUR(M.abiertoImporte)}${M.sinImporte?` · <b class="warn">${M.sinImporte} sin importe</b>`:''}</div></div>
    </div>`,
    `<div><div class="h3s">Embudo</div><div class="mini-fun">${fun}</div></div>`];
  return tile(...head,body);
}
function opTile(){
  const d=OP.homeData();
  const head=['t-op','Operación','Empresas, documentación y cumplimiento','op','Abrir Operación'];
  if(d.state==='nodb') return tile(...head,wait('Sin conexión con la base de datos.'));
  if(d.state==='loading') return tile(...head,wait('Conectando con tus datos…'));
  if(!d.empresas) return tile(...head,`<div class="sub">Todavía no hay empresas. Crea la primera en Operación.</div><div><button class="btn primary" data-nav="op:empresas">Ir a Empresas</button></div>`);
  const cls=d.pct>=90?'good':d.pct>=60?'warn':'bad';
  const pend=[['Faltan',d.c.falta,'bad'],['Caducados',d.c.caducado,'bad'],['Ilegibles',d.c.ilegible,'bad'],['En revisión',d.c.revision,'accent']].filter(p=>p[1]>0);
  const top=d.top.map(t=>`<button class="lrow" data-nav="op:empresas:${esc(t.id)}"><span class="nm">${esc(t.nombre)}</span><span class="chip ${t.caducados||t.faltan?'bad':'warn'}">${t.n} pendiente${t.n===1?'':'s'}</span></button>`).join('');
  const body=[`<div class="hero"><div class="lab">Grado de cumplimiento</div><div class="v ${cls}">${d.pct}<small> %</small></div>
      <div class="mbar ${cls}" role="img" aria-label="${d.pct} % de documentos vigentes"><i style="width:${d.pct}%"></i></div>
      <div class="s">${d.vigentes} de ${d.total} documentos vigentes</div></div>
    <div><div class="h3s">Pendientes · ${d.pendientes}</div>${pend.length?`<div class="chips2" style="margin-top:6px">${pend.map(p=>`<span class="chip ${p[2]}">${p[0]} ${p[1]}</span>`).join('')}</div>`:'<div class="sub good" style="margin-top:4px">Nada pendiente</div>'}</div>`,
    `<div class="kg k3"><div class="k"><div class="lab">Empresas</div><div class="v">${d.empresas}</div></div><div class="k"><div class="lab">Trabaj.</div><div class="v">${d.trab}</div></div><div class="k"><div class="lab">Máquinas</div><div class="v">${d.maq}</div></div></div>
    <div class="kg"><div class="k"><div class="lab">Avisos de caducidad</div><div class="v ${d.avisos?'warn':''}">${d.avisos}</div><div class="s">${d.avisos?'el próximo en '+d.prox+' d':'ninguno próximo'}</div></div>
      <div class="k"><div class="lab">Incidencias · mes</div><div class="v">${fmtH(d.horasInc)}<small> h</small></div><div class="s">gestión de incidencias</div></div></div>`,
    top?`<div><div class="h3s">Empresas con más pendientes</div>${top}</div>`:'<div class="sub">Ninguna empresa con pendientes.</div>'];
  return tile(...head,body);
}
function rentTile(){
  const d=OP.rentHome();
  const head=['t-rent','Rentabilidad','Mes en curso: '+esc(d.mesNom||''),'rent','Abrir Rentabilidad'];
  if(d.state==='nodb') return tile(...head,wait('Sin conexión con la base de datos.'));
  if(d.state==='loading') return tile(...head,wait('Conectando con tus datos…'));
  if(!d.empresas) return tile(...head,`<div class="sub">Todavía no hay empresas con tarifa.</div>`);
  const cls=d.pct==null?'':d.pct<0?'bad':d.pct<0.2?'warn':'good';
  const worst=d.worst.map(x=>`<button class="lrow" data-nav="rent"><span class="nm">${esc(x.nombre)}</span><span><span class="sub">${fmtEUR(x.margen)}</span> <span class="chip ${x.pct<0?'bad':x.pct<0.2?'warn':'good'}">${Math.round(x.pct*100)} %</span></span></button>`).join('');
  const body=[`${d.hasC?`<div class="hero"><div class="lab">Margen</div><div class="v ${cls}">${d.pct==null?'—':Math.round(d.pct*100)}<small>${d.pct==null?'':' %'}</small></div>
      <div class="s">${fmtEUR(d.margen)} de margen sobre ${fmtEUR(d.ingreso)} de ingreso</div></div>`:`<div class="note">Pon los costes por hora en Ajustes para ver el margen.</div>`}`,
    `<div class="kg">
      <div class="k"><div class="lab">Ingreso estimado</div><div class="v">${fmtEUR(d.ingreso)}</div><div class="s">${d.empresas} empresa${d.empresas===1?'':'s'}${d.sinTarifa?` · ${d.sinTarifa} sin tarifa`:''}</div></div>
      <div class="k"><div class="lab">Coste de horas</div><div class="v">${d.hasC?fmtEUR(d.coste):'—'}</div><div class="s">${fmtH(d.horas)} h apuntadas</div></div>
      <div class="k"><div class="lab">€ por hora</div><div class="v">${d.horas>0?fmtEUR(d.ingreso/d.horas):'—'}</div><div class="s">ingreso / horas</div></div>
      <div class="k"><div class="lab">Horas por tipo</div><div class="v" style="font-size:20px">${fmtH(d.h.comercial)} · ${fmtH(d.h.operacion)} · ${fmtH(d.h.incidencias)}</div><div class="s">com. · oper. · inc.</div></div>
    </div>`,
    worst?`<div><div class="h3s">Clientes con peor margen</div>${worst}</div>`:`<div class="sub">${d.horas>0?'Sin datos de margen por cliente.':'Aún no hay horas este mes: el margen aparecerá al apuntarlas.'}</div>`];
  return tile(...head,body);
}
function renderHome(){
  const hoy=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
  homeEl.innerHTML=`<div class="hhead"><h1>Panel de control</h1><div class="sub">${esc(hoy)}</div></div>
    <div class="thirds">${crmTile()}${opTile()}${rentTile()}</div>`;
}

})();
})();
